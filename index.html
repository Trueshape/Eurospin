<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light only">
<title>Manifesto Turno — Colli</title>
<style>
  html{
    color-scheme: light only;
  }
  :root{
    --kraft-1: #cbb086;
    --kraft-2: #b89a6c;
    --paper: #f6efdd;
    --paper-2: #efe6cd;
    --ink: #2b2420;
    --ink-soft: #6e5f4b;
    --ink-faint: #9c8b70;
    --stamp-red: #a83c2f;
    --stamp-red-dim: rgba(168,60,47,0.35);
    --stamp-blue: #2f4d63;
    --line: rgba(43,36,32,0.22);
    --tape: rgba(255,255,255,0.55);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background:
      repeating-linear-gradient(
        135deg,
        var(--kraft-1) 0px, var(--kraft-1) 26px,
        var(--kraft-2) 26px, var(--kraft-2) 27px
      );
    font-family: Arial, Helvetica, sans-serif;
    color: var(--ink);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:40px 16px;
  }

  .page{
    display:flex;
    flex-direction:column;
    align-items:center;
    width:100%;
    max-width:560px;
  }

  .logo-wrap{
    display:flex;
    justify-content:center;
    margin-bottom:-46px;
    position:relative;
    z-index:5;
  }
  .logo-wrap img{
    width:112px;
    height:112px;
    border-radius:50%;
    box-shadow: 0 12px 30px -8px rgba(0,0,0,0.55);
    border:4px solid var(--paper);
  }

  .tag{
    width:100%;
    background: var(--paper);
    border-radius:10px;
    position:relative;
    padding-top:64px;
    box-shadow:
      0 26px 60px -18px rgba(30,20,10,0.45),
      0 2px 0 rgba(255,255,255,0.4) inset;
  }

  /* bordo "cucito" tratteggiato interno */
  .tag::before{
    content:"";
    position:absolute;
    inset:10px;
    border:2px dashed var(--line);
    border-radius:6px;
    pointer-events:none;
  }

  /* strisce di nastro da imballaggio agli angoli superiori */
  .tape{
    position:absolute;
    top:-14px;
    width:96px;
    height:34px;
    background: var(--tape);
    box-shadow: 0 2px 6px rgba(0,0,0,0.15);
    opacity:0.85;
  }
  .tape::after{
    content:"";
    position:absolute; inset:0;
    background: repeating-linear-gradient(
      115deg,
      rgba(255,255,255,0.5) 0px, rgba(255,255,255,0.5) 2px,
      transparent 2px, transparent 6px
    );
  }
  .tape-left{ left:-18px; transform:rotate(-38deg); }
  .tape-right{ right:-18px; transform:rotate(38deg); }

  .manifest{
    padding:18px 30px 4px;
  }
  .line{
    display:flex;
    align-items:baseline;
    gap:8px;
    padding:15px 0;
    border-bottom:1px dotted var(--line);
  }
  .line:last-child{ border-bottom:none; }
  .line .label{
    font-size:13.5px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:0.03em;
    color: var(--ink);
    white-space:nowrap;
  }
  .line .label small{
    display:block;
    font-size:9.5px;
    font-weight:400;
    text-transform:none;
    letter-spacing:0.01em;
    color: var(--ink-faint);
    margin-top:2px;
  }
  .leader{
    flex:1;
    border-bottom:2px dotted var(--ink-faint);
    margin:0 6px;
    transform:translateY(-4px);
    opacity:0.6;
  }
  .val{
    flex:0 0 auto;
    justify-self:end;
  }

  input[type=number], input[type=time]{
    width:118px;
    background: var(--paper-2);
    border:1.5px solid var(--ink);
    border-radius:3px;
    color: var(--ink);
    font-family:'Courier New', monospace;
    font-weight:700;
    font-size:18px;
    text-align:right;
    padding:6px 10px;
    outline:none;
    -moz-appearance: textfield;
    color-scheme: light;
  }
  input[type=number]::-webkit-outer-spin-button,
  input[type=number]::-webkit-inner-spin-button{
    -webkit-appearance:none; margin:0;
  }
  input[type=number]:focus, input[type=time]:focus{
    border-color: var(--stamp-red);
    background:#fff;
  }

  .readout{
    width:118px;
    background: transparent;
    border:1.5px solid var(--stamp-red);
    color: var(--stamp-red);
    border-radius:3px;
    font-family:'Courier New', monospace;
    font-weight:700;
    font-size:18px;
    text-align:right;
    padding:6px 10px;
  }

  .stepper{
    display:flex;
    align-items:center;
    gap:4px;
    width:118px;
  }
  .stepper input[type=number]{
    width:auto;
    flex:1 1 auto;
    min-width:0;
    padding:6px 2px;
    text-align:center;
  }
  .step-btn{
    flex:0 0 26px;
    width:26px;
    height:26px;
    padding:0;
    border-radius:50%;
    background: var(--paper);
    border:1.5px solid var(--ink);
    color: var(--ink);
    font-size:16px;
    line-height:1;
    cursor:pointer;
    transition: background .15s, color .15s, border-color .15s;
  }
  .step-btn:hover{
    border-color: var(--stamp-red);
    color: var(--stamp-red);
  }

  /* timbro dei risultati */
  .stamp-zone{
    display:flex;
    justify-content:center;
    padding:26px 24px 10px;
  }
  .stamp{
    width:198px;
    height:198px;
    border-radius:50%;
    border:3px solid var(--stamp-red);
    box-shadow: 0 0 0 5px var(--paper), 0 0 0 6px var(--stamp-red-dim);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    transform: rotate(-5deg);
    color: var(--stamp-red);
    position:relative;
  }
  .stamp .eyebrow{
    font-size:9.5px;
    letter-spacing:0.22em;
    text-transform:uppercase;
    opacity:0.85;
  }
  .stamp .flap{
    font-family:'Courier New', monospace;
    font-size:38px;
    font-weight:700;
    line-height:1.05;
    margin:2px 0;
  }
  .stamp .flap small{
    font-size:16px;
    font-weight:400;
    margin:0 2px;
  }

  .exit-row{
    display:flex;
    justify-content:center;
    align-items:baseline;
    gap:8px;
    padding:6px 24px 22px;
    text-align:center;
  }
  .exit-label{
    font-size:10.5px;
    letter-spacing:0.16em;
    text-transform:uppercase;
    color: var(--ink-faint);
  }
  .exit-value{
    font-family:'Courier New', monospace;
    font-size:20px;
    font-weight:700;
    color: var(--stamp-blue);
    border-bottom:2px solid var(--stamp-blue);
    padding-bottom:1px;
  }

  /* sezione staccabile in fondo, stile scontrino */
  .altro{
    position:relative;
    margin-top:6px;
  }
  .altro::before{
    content:"";
    position:absolute;
    top:0; left:16px; right:16px;
    border-top:2px dashed var(--ink-faint);
  }
  .altro::after{
    content:"✂";
    position:absolute;
    top:-11px; left:16px;
    background:var(--paper);
    color:var(--ink-faint);
    font-size:13px;
    padding:0 4px;
  }
  .altro summary{
    list-style:none;
    cursor:pointer;
    padding:20px 30px 10px;
    font-size:11.5px;
    letter-spacing:0.16em;
    text-transform:uppercase;
    color: var(--ink-soft);
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  .altro summary::-webkit-details-marker{ display:none; }
  .altro summary::after{
    content:"+";
    font-size:15px;
    color: var(--ink-faint);
  }
  .altro[open] summary::after{ content:"−"; }
  .altro-body{
    padding:2px 30px 26px;
  }
  .altro-controls{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
  }
  .altro-controls input[type=number]{
    width:100px;
    flex:1 1 100px;
    text-align:center;
  }
  .delta-btn{
    flex:1 1 auto;
    background: var(--paper);
    border:1.5px solid var(--ink);
    border-radius:3px;
    color: var(--ink);
    font-family: Arial, sans-serif;
    font-weight:700;
    font-size:11.5px;
    letter-spacing:0.03em;
    padding:9px 12px;
    cursor:pointer;
    white-space:nowrap;
    transition: border-color .15s, color .15s;
  }
  .delta-plus:hover{ border-color: var(--stamp-blue); color: var(--stamp-blue); }
  .delta-minus:hover{ border-color: var(--stamp-red); color: var(--stamp-red); }

  .history{
    list-style:none;
    margin:16px 0 0;
    padding:0;
    max-height:160px;
    overflow-y:auto;
    border-top:1px dotted var(--line);
  }
  .history:empty{ margin:0; border-top:none; }
  .history li{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    gap:10px;
    padding:8px 2px;
    border-bottom:1px dotted var(--line);
    font-family:'Courier New', monospace;
    font-size:11.5px;
  }
  .history li:last-child{ border-bottom:none; }
  .history .h-delta{ font-weight:700; }
  .history .h-delta.plus{ color: var(--stamp-blue); }
  .history .h-delta.minus{ color: var(--stamp-red); }
  .history .h-total{ color: var(--ink-soft); flex:1; text-align:right; }
  .history .h-del{
    background:none;
    border:none;
    color: var(--ink-faint);
    font-size:15px;
    line-height:1;
    cursor:pointer;
    padding:0 2px;
    transition: color .15s;
  }
  .history .h-del:hover{ color: var(--stamp-red); }

  @media (max-width:480px){
    body{ padding:10px 10px; align-items:flex-start; min-height:100dvh; }
    .logo-wrap{ margin-bottom:-26px; }
    .logo-wrap img{ width:64px; height:64px; border-width:3px; }
    .tag{ padding-top:36px; }
    .tag::before{ inset:6px; }

    .manifest{ padding:6px 14px 0; }
    .line{ flex-wrap:wrap; padding:6px 0; gap:4px; }
    .line .label{ font-size:10.5px; }
    .line .label small{ font-size:7.5px; margin-top:1px; }
    .leader{ display:none; }
    .val{ margin-left:auto; }

    input[type=number], input[type=time], .readout{ width:88px; font-size:13px; padding:4px 6px; }
    .stepper{ width:88px; gap:3px; }
    .stepper input[type=number]{ padding:4px 2px; }
    .step-btn{ flex:0 0 20px; width:20px; height:20px; font-size:12px; }

    .stamp-zone{ padding:8px 16px 2px; }
    .stamp{ width:104px; height:104px; border-width:2px; box-shadow: 0 0 0 3px var(--paper), 0 0 0 4px var(--stamp-red-dim); }
    .stamp .eyebrow{ font-size:6.5px; }
    .stamp .flap{ font-size:20px; margin:1px 0; }
    .stamp .flap small{ font-size:9px; }

    .exit-row{ padding:4px 16px 8px; gap:5px; }
    .exit-label{ font-size:8.5px; }
    .exit-value{ font-size:14px; }

    .altro{ margin-top:2px; }
    .altro summary{ padding:8px 16px 6px; font-size:9.5px; }
    .altro-body{ padding:2px 16px 12px; }
    .altro-controls input[type=number]{ width:100%; flex-basis:100%; }
  }
</style>
</head>

  </div>

  <div class="tag">
    <div class="tape tape-left"></div>
    <div class="tape tape-right"></div>

    <div class="manifest">
      <div class="line">
        <span class="label">Colli<small>totale da lavorare</small></span>
        <span class="leader"></span>
        <span class="val"><input type="number" id="colli" value="1200" min="0" step="1"></span>
      </div>

      <div class="line">
        <span class="label">Persone<small>addetti al turno</small></span>
        <span class="leader"></span>
        <span class="val">
          <span class="stepper">
            <button type="button" class="step-btn" id="personeMinus" aria-label="Diminuisci persone">&minus;</button>
            <input type="number" id="persone" value="5" min="1" step="1">
            <button type="button" class="step-btn" id="personePlus" aria-label="Aumenta persone">&plus;</button>
          </span>
        </span>
      </div>

      <div class="line">
        <span class="label">Colli/h<small>resa per persona</small></span>
        <span class="leader"></span>
        <span class="val"><input type="number" id="colliOra" value="60" min="1" step="1"></span>
      </div>

      <div class="line">
        <span class="label">Prossima soglia<small>colli al prossimo quarto d'ora</small></span>
        <span class="leader"></span>
        <span class="val"><div class="readout" id="soglia">20</div></span>
      </div>

      <div class="line">
        <span class="label">Inizio turno<small>orario ingresso</small></span>
        <span class="leader"></span>
        <span class="val"><input type="time" id="orarioInizio" value="20:30"></span>
      </div>
    </div>

    <div class="stamp-zone">
      <div class="stamp">
        <div class="eyebrow">Ore stimate</div>
        <div class="flap" id="oreLavoro">6<small>h</small>40<small>min</small></div>
      </div>
    </div>

    <div class="exit-row">
      <span class="exit-label">Uscita stimata</span>
      <span class="exit-value" id="orarioUscita">03:10</span>
    </div>

    <details class="altro">
      <summary>Altro</summary>
      <div class="altro-body">
        <div class="altro-controls">
          <button type="button" class="delta-btn delta-minus" id="sottraiBtn">&minus; Sottrai</button>
          <input type="number" id="deltaColli" placeholder="0" min="0" step="1">
          <button type="button" class="delta-btn delta-plus" id="aggiungiBtn">&plus; Aggiungi</button>
        </div>
        <ul class="history" id="history"></ul>
      </div>
    </details>

  </div>

</div>

<script>
  const $ = id => document.getElementById(id);
  const colli = $('colli'), colliOra = $('colliOra'), persone = $('persone');
  const oreLavoro = $('oreLavoro'), soglia = $('soglia');
  const orarioInizio = $('orarioInizio'), orarioUscita = $('orarioUscita');
  const deltaColli = $('deltaColli');
  const history = $('history');

  function registraStorico(delta, nuovoTotale){
    const li = document.createElement('li');
    const segno = delta > 0 ? '+' : '−';
    const classe = delta > 0 ? 'plus' : 'minus';
    li.dataset.delta = delta;
    li.innerHTML = `
      <span class="h-delta ${classe}">${segno}${Math.abs(delta)}</span>
      <span class="h-total">→ ${nuovoTotale} colli</span>
      <button type="button" class="h-del" aria-label="Elimina questa modifica">&times;</button>
    `;
    li.querySelector('.h-del').addEventListener('click', () => {
      const d = parseFloat(li.dataset.delta) || 0;
      const totaleAggiornato = Math.max(0, (parseFloat(colli.value) || 0) - d);
      colli.value = totaleAggiornato;
      li.remove();
      calcola();
    });
    history.prepend(li);
  }

  function calcola(){
    const c = parseFloat(colli.value) || 0;
    const ch = parseFloat(colliOra.value) || 0;
    const p = parseFloat(persone.value) || 0;

    if(ch <= 0 || p <= 0){
      oreLavoro.innerHTML = '—';
      soglia.textContent = '—';
      orarioUscita.textContent = '—';
      return;
    }

    const oreTotali = c / (ch * p);
    const ore = Math.floor(oreTotali);
    const minuti = Math.round((oreTotali - ore) * 60);

    let oreFinal = ore, minFinal = minuti;
    if(minFinal === 60){ oreFinal += 1; minFinal = 0; }

    oreLavoro.innerHTML = `${oreFinal}<small>h</small>${String(minFinal).padStart(2,'0')}<small>min</small>`;

    // pagamento a scaglioni di 15 minuti: colli mancanti per raggiungere il prossimo scaglione
    // se si è già esattamente su un multiplo di 15 min, la soglia è raggiunta (0)
    const quarti = Math.ceil(oreTotali / 0.25 - 1e-9);
    const prossimaSogliaOre = quarti * 0.25;
    const colliProxSoglia = Math.max(0, Math.round(prossimaSogliaOre * ch * p - c));
    soglia.textContent = colliProxSoglia;

    // orario di uscita stimato = orario di inizio + ore di lavoro
    if(orarioInizio.value){
      const [hIn, mIn] = orarioInizio.value.split(':').map(Number);
      const inizioMin = hIn * 60 + mIn;
      const durataMin = oreFinal * 60 + minFinal;
      const uscitaMin = (inizioMin + durataMin) % (24 * 60);
      const hOut = Math.floor(uscitaMin / 60);
      const mOut = uscitaMin % 60;
      orarioUscita.textContent = `${String(hOut).padStart(2,'0')}:${String(mOut).padStart(2,'0')}`;
    } else {
      orarioUscita.textContent = '—';
    }
  }

  [colli, colliOra, persone, orarioInizio].forEach(el => el.addEventListener('input', calcola));

  $('personeMinus').addEventListener('click', () => {
    const val = Math.max(1, (parseInt(persone.value) || 1) - 1);
    persone.value = val;
    calcola();
  });

  $('personePlus').addEventListener('click', () => {
    const val = (parseInt(persone.value) || 0) + 1;
    persone.value = val;
    calcola();
  });

  $('aggiungiBtn').addEventListener('click', () => {
    const delta = parseFloat(deltaColli.value) || 0;
    if(delta === 0) return;
    const nuovoTotale = Math.max(0, (parseFloat(colli.value) || 0) + delta);
    colli.value = nuovoTotale;
    deltaColli.value = '';
    calcola();
    registraStorico(delta, nuovoTotale);
  });

  $('sottraiBtn').addEventListener('click', () => {
    const delta = parseFloat(deltaColli.value) || 0;
    if(delta === 0) return;
    const nuovoTotale = Math.max(0, (parseFloat(colli.value) || 0) - delta);
    colli.value = nuovoTotale;
    deltaColli.value = '';
    calcola();
    registraStorico(-delta, nuovoTotale);
  });

  calcola();
</script>
